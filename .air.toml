# Run from repo root: air

root = "."
tmp_dir = "tmp"

[build]
  # Backend entrypoint
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"

  # Rebuild when these change
  include_ext = ["go", "mod", "sum"]
  exclude_dir = [
    "tmp",
    "bin",
    "vendor",
    "frontend",
    "node_modules",
    "dist",
    "docs",
    ".git",
    ".cursor",
    ".github",
  ]
  exclude_regex = ["_test\\.go$"]

  # Wait a moment after a save burst before rebuilding
  delay = 800
  stop_on_error = true

[log]
  time = true
  main_only = false

[color]
  app = "magenta"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
